<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XmasMarkt</title>
<meta name="description" content="Find Christmas markets in Berlin — locations, vendors, hours, and your saved favourites.">
<meta name="theme-color" content="#10182D">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/styles.css">
<script>
  // Applied before first paint so there's no flash of the wrong theme.
  (function () {
    var stored = localStorage.getItem("cmapp_theme");
    document.documentElement.dataset.theme = stored || "dark";
  })();
</script>
</head>
<body>

<header class="app-header">
  <div class="app-header__inner">
    <h1 class="app-header__title">
      <span class="app-header__wordmark">
        <img class="app-header__star" src="icons/icon-192.png" alt="" width="25" height="25">
        <span class="accent">Xmas</span>Markt
      </span>
      <div class="app-header__icon-btns">
        <button class="lang-toggle" id="lang-toggle" aria-label="Switch language">DE</button>
        <a class="feedback-toggle" id="feedback-toggle" aria-label="Send feedback" data-i18n-aria="sendFeedback">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" data-i18n-aria="toggleTheme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path></svg>
        </button>
      </div>
    </h1>
    <p class="app-header__tagline" data-i18n="tagline">Every Christmas market in Berlin, mapped.</p>
    <div class="app-header__controls">
      <div class="view-switch" role="tablist">
        <button class="view-switch__btn" data-view="map" role="tab" aria-pressed="true" data-i18n="map">Map</button>
        <button class="view-switch__btn" data-view="list" role="tab" aria-pressed="false" data-i18n="list">List</button>
      </div>
      <button class="saved-toggle" id="saved-toggle" aria-pressed="false">
        <span class="heart">♥</span> <span data-i18n="saved">Saved</span>
      </button>
    </div>
    <div class="app-header__filterbar">
      <select class="filter-select" id="sort-by" data-i18n-aria="sortBy" aria-label="Sort">
        <option value="recommended" data-i18n="sortRecommended">Recommended</option>
        <option value="ending" data-i18n="sortEnding">Ending soonest</option>
        <option value="name" data-i18n="sortName">Name (A–Z)</option>
        <option value="nearest" data-i18n="sortNearest">Nearest to me</option>
      </select>
      <div class="filter-pills" id="filter-district" role="group" aria-label="Filter by district"></div>
      <div class="filter-pills" id="filter-entry" role="group" aria-label="Filter by entry">
        <button class="filter-pill" data-value="all" aria-pressed="true" data-i18n="entryAll">All entry</button>
        <button class="filter-pill" data-value="free" aria-pressed="false" data-i18n="entryFree">Free</button>
        <button class="filter-pill" data-value="ticketed" aria-pressed="false" data-i18n="entryTicketed">Ticketed</button>
      </div>
    </div>
  </div>
</header>

<div class="share-banner" id="share-banner" hidden>
  <p class="share-banner__text" id="share-banner-text"></p>
  <div class="share-banner__actions">
    <button class="share-banner__send" id="share-banner-send" data-i18n="shareBannerSend">Send as feedback</button>
    <button class="share-banner__dismiss" id="share-banner-dismiss" aria-label="Dismiss" data-i18n-aria="close">✕</button>
  </div>
</div>

<main>
  <section id="map-view" class="view">
    <div id="map"></div>
  </section>

  <section id="list-view" class="view" hidden></section>
</main>

<div class="sheet-overlay" id="sheet-overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet__handle"></div>
    <div class="sheet__header">
      <div>
        <h2 class="sheet__title" id="sheet-title"></h2>
        <p class="sheet__meta" id="sheet-meta"></p>
        <a class="sheet__address" id="sheet-address" target="_blank" rel="noopener" hidden></a>
      </div>
      <div class="sheet__actions">
        <a class="sheet__icon-btn" id="sheet-calendar-btn" target="_blank" rel="noopener" aria-label="Add to calendar" data-i18n-aria="addToCalendar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="7" y1="3" x2="7" y2="7"></line><line x1="17" y1="3" x2="17" y2="7"></line><line x1="12" y1="13" x2="12" y2="17"></line><line x1="10" y1="15" x2="14" y2="15"></line></svg>
        </a>
        <button class="sheet__icon-btn" id="sheet-share-btn" aria-label="Share market" data-i18n-aria="shareMarket">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"></path><path d="M5 12v7a1 1 0 001 1h12a1 1 0 001-1v-7"></path></svg>
        </button>
        <button class="fav-btn" id="sheet-fav-btn" aria-pressed="false" aria-label="Save market" data-i18n-aria="saveMarket">♥</button>
        <button class="sheet__close" id="sheet-close" aria-label="Close" data-i18n-aria="close">✕</button>
      </div>
    </div>
    <div class="sheet__banner" id="sheet-banner"></div>
    <div class="sheet__body" id="sheet-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/app.js" defer></script>
</body>
</html>
