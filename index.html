<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XmasMarkt</title>
<meta name="description" content="Find Christmas markets in Berlin — locations, vendors, hours, and your saved favourites.">
<meta name="theme-color" content="#10182D">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/styles.css">
<script>
  // Applied before first paint so there's no flash of the wrong theme.
  (function () {
    var stored = localStorage.getItem("cmapp_theme");
    document.documentElement.dataset.theme = stored || "dark";
  })();
</script>
</head>
<body>

<header class="app-header">
  <div class="app-header__inner">
    <h1 class="app-header__title">
      <span class="app-header__wordmark">
        <svg class="app-header__star" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5l2.4 7.1 7.6.1-6 4.7 2.2 7.4L12 16.5l-6.2 4.3 2.2-7.4-6-4.7 7.6-.1z"></path></svg>
        <span class="accent">Xmas</span>Markt
      </span>
      <div class="app-header__icon-btns">
        <button class="lang-toggle" id="lang-toggle" aria-label="Switch language">DE</button>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" data-i18n-aria="toggleTheme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path></svg>
        </button>
      </div>
    </h1>
    <p class="app-header__tagline" data-i18n="tagline">Every Christmas market in Berlin, mapped.</p>
    <div class="app-header__controls">
      <div class="view-switch" role="tablist">
        <button class="view-switch__btn" data-view="map" role="tab" aria-pressed="true" data-i18n="map">Map</button>
        <button class="view-switch__btn" data-view="list" role="tab" aria-pressed="false" data-i18n="list">List</button>
      </div>
      <button class="saved-toggle" id="saved-toggle" aria-pressed="false">
        <span class="heart">♥</span> <span data-i18n="saved">Saved</span>
      </button>
    </div>
  </div>
</header>

<main>
  <section id="map-view" class="view">
    <div id="map"></div>
  </section>

  <section id="list-view" class="view" hidden></section>
</main>

<div class="sheet-overlay" id="sheet-overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet__handle"></div>
    <div class="sheet__header">
      <div>
        <h2 class="sheet__title" id="sheet-title"></h2>
        <p class="sheet__meta" id="sheet-meta"></p>
        <a class="sheet__address" id="sheet-address" target="_blank" rel="noopener" hidden></a>
      </div>
      <div class="sheet__actions">
        <button class="sheet__icon-btn" id="sheet-share-btn" aria-label="Share market" data-i18n-aria="shareMarket">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"></path><path d="M5 12v7a1 1 0 001 1h12a1 1 0 001-1v-7"></path></svg>
        </button>
        <button class="fav-btn" id="sheet-fav-btn" aria-pressed="false" aria-label="Save market" data-i18n-aria="saveMarket">♥</button>
        <button class="sheet__close" id="sheet-close" aria-label="Close" data-i18n-aria="close">✕</button>
      </div>
    </div>
    <div class="sheet__banner" id="sheet-banner"></div>
    <div class="sheet__body" id="sheet-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/app.js" defer></script>
</body>
</html>
