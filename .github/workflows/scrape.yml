name: Scrape market data

on:
  schedule:
    # Once a day at 05:00 UTC (early morning in Berlin) — the sources
    # change slowly, so there's no need to poll more often. If you change
    # this, update the freshness thresholds in js/app.js (renderDataChecked).
    - cron: "0 5 * * *"
  workflow_dispatch: {}

# The default GITHUB_TOKEN is read-only; the final step pushes the
# refreshed data commit, which fails with a 403 without this.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scraper deps
        working-directory: scraper
        run: npm install

      - name: Run scraper
        working-directory: scraper
        run: npm run scrape

      - name: Commit updated data
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Update market data"
          # Rebase onto anything pushed while the scrape ran, so a
          # concurrent human commit doesn't make this push non-fast-forward.
          git pull --rebase origin main
          git push
