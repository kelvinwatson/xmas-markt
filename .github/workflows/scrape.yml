name: Scrape market data

on:
  schedule:
    # 06:00 and 18:00 UTC daily. Adjust once real sources are picked —
    # no need to poll faster than sources actually update.
    - cron: "0 6,18 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scraper deps
        working-directory: scraper
        run: npm install

      - name: Run scraper
        working-directory: scraper
        run: npm run scrape

      - name: Commit updated data
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Update market data"
          git push
